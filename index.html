<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Glass Calculator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg6EYwPQQGZ_qR9waaAJ6uPDYe_KQD4H-XVQ&s')
        no-repeat center/cover fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: -1;
    }

    .calculator {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(255,255,255,0.2);
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 26px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.15);
      color: white;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    button {
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.15);
      color: white;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover { transform: scale(1.05); }

    button:active { transform: scale(0.95); }

    .operator { background: rgba(0,188,212,0.85); }
    .equal { background: rgba(76,175,80,0.9); }
    .clear {
      grid-column: span 4;
      background: rgba(244,67,54,0.9);
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="calculator" role="application" aria-label="Calculator">
    <input id="display" type="text" aria-label="Calculator display" readonly />

    <div class="buttons">
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('/')">÷</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('*')">×</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="operator" onclick="add('-')">−</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
      <button class="operator" onclick="add('+')">+</button>

      <button class="clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    const operators = ["+", "-", "*", "/"];

    function add(value) {
      const last = display.value.slice(-1);
      if (operators.includes(last) && operators.includes(value)) return;
      display.value += value;
    }

    function calculate() {
      try {
        const result = Function('"use strict";return (' + display.value + ')')();
        display.value = result;
      } catch {
        display.value = "Error";
        setTimeout(clearAll, 1000);
      }
    }

    function clearAll() {
      display.value = "";
    }

    // Keyboard support
    document.addEventListener("keydown", e => {
      if (!isNaN(e.key) || operators.includes(e.key) || e.key === ".") add(e.key);
      if (e.key === "Enter") calculate();
      if (e.key === "Backspace") display.value = display.value.slice(0, -1);
      if (e.key === "Escape") clearAll();
    });
  </script>
</body>
</html>
